name: Windows Build

on:
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "windows/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file exe
        run: dotnet publish windows/AdSentinel/AdSentinel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path out/AdSentinel.exe -DestinationPath AdSentinel-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdSentinel-win-x64
          path: AdSentinel-win-x64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AdSentinel-win-x64.zip
